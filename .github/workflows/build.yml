name: "Gradle build"
permissions: {}
on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  build:
    name: "Gradle build ${{ matrix.target }}"
    runs-on: ubuntu-latest
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: 1

    strategy:
      matrix:
        target: [Debug, Release]

    steps:
      - name: "Free disk space"
        run: |
          # Deleting unneeded software packages
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go

          # Log available space
          df -h
      - name: "Checkout sources"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: "Setup Java"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
      - name: "Setup matchers"
        run: |
          # Setting up matchers...

          matchers_dir='${{ github.workspace }}/.github/matchers'
          matcher_list()
          {
            echo 'gradle-build-matcher.json'
            echo 'gradle-build-kotlin-error-matcher.json'
          }

          matcher_list | while IFS='' read -r NAME; do
            if test -f "${matchers_dir:?}/${NAME:?}"; then
              echo "::add-matcher::${matchers_dir:?}/${NAME:?}"
              echo "Matcher configured: ${NAME:?}"
            fi
          done
      - name: "Decode Keystore"
        if: matrix.target == 'Release'
        run: |
          if [ ! -z "${{ secrets.KEY_STORE }}" ]; then
            echo "${{ secrets.KEY_STORE }}" | base64 --decode > keystore.jks
          fi
      - name: "Execute Gradle assemble"
        run: "./gradlew assemble${{ matrix.target }}"
      - name: "Sign Release APK"
        if: matrix.target == 'Release' && hashFiles('keystore.jks') != ''
        run: |
          APK=$(find play-services-core/build/outputs/apk/ -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            ${ANDROID_HOME}/build-tools/35.0.0/apksigner sign \
              --ks keystore.jks \
              --ks-pass pass:${{ secrets.KEY_STORE_PASSWORD }} \
              --key-pass pass:${{ secrets.KEY_PASSWORD }} \
              --ks-key-alias ${{ secrets.ALIAS }} \
              "$APK" || echo "Signing failed, uploading unsigned"
          fi
      - name: "Upload APK"
        uses: actions/upload-artifact@v4
        with:
          name: npatch-gms-${{ matrix.target }}
          path: play-services-core/build/outputs/apk/**/*.apk
          retention-days: 30
      - name: "Execute Gradle lint"
        if: matrix.target == 'Debug'
        run: "./gradlew lint${{ matrix.target }}"
